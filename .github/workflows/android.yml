name: Build Android AAB

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: "false"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare release signing
        working-directory: android
        env:
          OTTANO_KEYSTORE_BASE64: ${{ secrets.OTTANO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$OTTANO_KEYSTORE_BASE64" ]; then
            echo "$OTTANO_KEYSTORE_BASE64" | base64 --decode > ottano-upload.jks
            echo "Upload keystore configured."
          else
            echo "No upload keystore configured: building an unsigned release bundle."
          fi

      - name: Build Android App Bundle
        working-directory: android
        env:
          OTTANO_KEYSTORE_FILE: ${{ github.workspace }}/android/ottano-upload.jks
          OTTANO_KEYSTORE_PASSWORD: ${{ secrets.OTTANO_KEYSTORE_PASSWORD }}
          OTTANO_KEY_ALIAS: ${{ secrets.OTTANO_KEY_ALIAS }}
          OTTANO_KEY_PASSWORD: ${{ secrets.OTTANO_KEY_PASSWORD }}
        run: |
          gradle :app:printSigningStatus
          gradle :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ottano-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
