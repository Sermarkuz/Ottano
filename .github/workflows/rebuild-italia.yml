name: Rebuild Ottano Italia

on:
  push:
    branches: [main]
    paths:
      - "ottano.template.html"
      - "build.py"
      - ".github/workflows/rebuild-italia.yml"
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-ottano-italia
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Rebuild Ottano with latest MIMIT data
        run: python build.py --scarica
      - name: Commit generated app
        run: |
          if git diff --quiet -- ottano.html; then
            echo "ottano.html already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ottano.html
          git commit -m "Rebuild Ottano Italia"
          git push
