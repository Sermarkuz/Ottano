name: Build Play Store Assets

on:
  push:
    branches: [main]
    paths:
      - "play-store/generate_assets.py"
      - ".github/workflows/play-store-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate assets
        run: |
          python -m pip install --disable-pip-version-check pillow
          python play-store/generate_assets.py
      - name: Commit generated PNG files
        run: |
          if git diff --quiet -- play-store/assets; then
            echo "Assets already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-store/assets
          git commit -m "Generate Google Play visual assets"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ottano-play-store-assets
          path: play-store/assets/*.png
